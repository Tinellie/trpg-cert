<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证件生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>生成器</h1>
    <p></p>
    <select id="typeSelect" class="custom-select">
        <option value="" disabled>类型</option>
        <option value="gm" selected>GM</option>
        <option value="pl">PL</option>
        <option value="fh">粉红</option>
    </select>
    <input type="text" id="nameInput" placeholder="输入名称" />
    <input type="file" id="imageInput" accept="image/*" />
    <button id="generateButton">生成</button>
    <button id="downloadButton" style="display:none;">下载svg</button>
    <button id="downloadPngButton" style="display:none;">下载png</button>
    <div id="certificateContainer"></div>
</div>
<script src="script.js"></script>
</body>
</html>
